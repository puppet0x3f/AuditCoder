name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Ubuntu ${{ matrix.ubuntu }} / Python ${{ matrix.python }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Compile all Python sources
        run: |
          python -m compileall -q \
            auditcoder auditcoder_class baselines/agentcoder tests experiments \
            scripts sample_apps_by_difficulty.py

      - name: Validate artifact-manifest logic
        run: python scripts/validate_artifact_manifest.py --self-test

      - name: Run table-aggregation self-test
        run: python tests/run_apps_audit_metrics.py --self-test

      - name: Scan tracked files for secrets
        run: python scripts/check_no_secrets.py

      - name: Run offline unit tests
        run: |
          python -m pytest -p no:cacheprovider tests \
            --ignore=tests/test_verifier_agent_1.py \
            -m "not integration" \
            -q

  container:
    name: Container backend smoke test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Build pinned non-root evaluation image
        run: docker build --tag auditcoder-eval:aaai27 containers/eval

      - name: Exercise container isolation backend
        env:
          AUDITCODER_EXECUTION_BACKEND: container
          AUDITCODER_CONTAINER_RUNTIME: docker
          AUDITCODER_CONTAINER_IMAGE: auditcoder-eval:aaai27
        run: |
          python - <<'PY'
          from auditcoder.verifier_agent.sandbox import SandboxExecutor

          result = SandboxExecutor().run("print('container-ok')")
          assert result.exit_code == 0, result.stderr
          assert result.stdout.strip() == "container-ok"
          PY
